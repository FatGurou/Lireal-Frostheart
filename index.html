<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lirael Frostheart</title>
<meta name="theme-color" content="#070b1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>

/* Arcane Night: midnight blue sky, silver filigree, emerald magic */
:root{
  --night:#070b1f;--night2:#0d1636;--panel:#0e1840;--ink:#e6ecf7;--muted:#8d9bbd;
  --silver:#c9d3e6;--silver2:#eef3ff;--silverD:#7f8aa6;--em:#2fd48a;--em2:#8dffc7;--emD:#0f7a4c;
  --display:"Cinzel Decorative","Cinzel",serif;--head:"Cinzel",serif;--body:"Cormorant Garamond",Georgia,serif;
  --read:Roboto,"Segoe UI",Arial,system-ui,sans-serif;--cut:12px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--ink);font-family:var(--read);background:var(--night);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- living sky ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(ellipse 120% 80% at 50% -10%,#1a2a66 0%,#0d1636 45%,#070b1f 80%)}
.sky .aurora{position:absolute;inset:-20%;opacity:.35;filter:blur(50px);
  background:radial-gradient(ellipse 40% 20% at 25% 30%,rgba(47,212,138,.55),transparent 70%),radial-gradient(ellipse 35% 18% at 75% 55%,rgba(60,120,255,.4),transparent 70%),radial-gradient(ellipse 30% 15% at 40% 80%,rgba(47,212,138,.35),transparent 70%);
  animation:aur 40s ease-in-out infinite alternate}
@keyframes aur{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(6%,-5%) rotate(6deg)}}
.sky .frost{position:absolute;inset:0;background:radial-gradient(ellipse at 0 0,rgba(220,235,255,.12),transparent 35%),radial-gradient(ellipse at 100% 100%,rgba(220,235,255,.1),transparent 35%)}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- header ---------- */
#shell{position:relative;z-index:2}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(rgba(7,11,31,.96),rgba(5,8,22,.94));border-bottom:1px solid var(--silverD);box-shadow:0 1px 0 rgba(238,243,255,.15),0 6px 24px rgba(0,0,0,.8);backdrop-filter:blur(6px)}
.top-in{max-width:760px;margin:0 auto;padding:8px 14px 0}
.r1{display:flex;align-items:center;gap:10px}
.menuBtn{width:42px;height:42px;padding:0;font-size:20px}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;
  background:linear-gradient(100deg,#7f8aa6 0%,#e6ecf7 30%,#ffffff 45%,#c9d3e6 60%,#7f8aa6 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 8s linear infinite}
.brand span{display:inline-block}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.crest{position:relative;width:44px;height:48px;flex:none}
.crest svg{position:absolute;inset:0}
.crest b{position:absolute;inset:0;display:grid;place-items:center;font:700 19px var(--head);color:var(--silver2);text-shadow:0 0 8px rgba(141,255,199,.5)}
.crest small{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font:600 9px var(--head);color:var(--silver);letter-spacing:.1em}
.r2{display:flex;align-items:center;gap:10px;margin-top:8px}
.miniHp{flex:1;height:12px;background:#040716;border:1px solid var(--silverD);position:relative;overflow:hidden;border-radius:6px}
.miniHp i,.bigHp i{position:absolute;left:0;top:0;bottom:0;transition:width .5s;background:linear-gradient(180deg,#d9f1ff,#6fb6ff 45%,#2d5fd1);box-shadow:0 0 10px rgba(111,182,255,.7)}
.miniHp span{position:absolute;inset:0;font:600 9.5px/12px var(--read);text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.crys{display:flex;gap:2px}
.cr{width:8px;height:13px;clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);background:linear-gradient(160deg,#c9ffe6,#2fd48a 50%,#0f7a4c);box-shadow:0 0 6px var(--em);animation:pulse 3s ease-in-out infinite}
.cr.used{background:#162048;animation:none}
@keyframes pulse{50%{filter:brightness(1.4)}}
.tabs{display:flex;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;background:none;border:none;padding:7px 8px 9px;font:600 12.5px var(--head);letter-spacing:.06em;color:var(--muted);position:relative;box-shadow:none;clip-path:none;min-height:0}
.tab .ic{display:block;font-size:17px;line-height:1;margin-bottom:3px;font-family:var(--read)}
.tab.on{color:var(--silver2);text-shadow:0 0 10px rgba(141,255,199,.6)}
.tab.on::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--em2),transparent);box-shadow:0 0 10px var(--em)}

/* ---------- controls ---------- */
button,.b{font-family:var(--head);font-weight:600;font-size:14.5px;letter-spacing:.04em;border:1px solid var(--silverD);background:linear-gradient(#18244f,#0b1233);color:var(--silver2);
  padding:7px 12px;min-height:38px;border-radius:3px;box-shadow:inset 0 1px 0 rgba(238,243,255,.15);transition:transform .08s,filter .15s}
button:active{transform:translateY(2px) scale(.97);filter:brightness(1.3)}
button.em{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em);color:#e6fff3;box-shadow:0 0 12px rgba(47,212,138,.35),inset 0 1px 0 rgba(200,255,230,.3)}
button.sil{background:linear-gradient(#eef3ff,#8d9bbd);color:#0b1233;border-color:#fff}
button.red{background:linear-gradient(#6e1a2a,#2c0812);border-color:#d46a7d;color:#ffe1e7}
button.blue{background:linear-gradient(#1f3f8a,#0b1840);border-color:#6fb6ff;color:#dcefff}
button:disabled{opacity:.35;pointer-events:none}
input{font:600 18px var(--read);color:var(--ink);background:rgba(4,7,22,.6);border:none;border-bottom:1px solid var(--silver);padding:6px;text-align:center;width:100%}
input:focus{outline:none;border-bottom-color:var(--em2);box-shadow:0 2px 10px -3px var(--em)}

/* ---------- panels: silver filigree on midnight glass ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 120px;display:grid;gap:16px}
.panel{position:relative;padding:16px 14px;border:1px solid rgba(201,211,230,.55);border-radius:4px;
  background:linear-gradient(180deg,rgba(18,30,78,.82),rgba(9,15,42,.88));box-shadow:inset 0 0 0 3px rgba(7,11,31,.85),inset 0 0 0 4px rgba(201,211,230,.22),0 8px 26px rgba(0,0,0,.6),inset 0 0 40px rgba(47,212,138,.05)}
.panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--silver);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:4px 0 0 0;box-shadow:-2px -2px 8px rgba(141,255,199,.25)}
.panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 4px 0;box-shadow:2px 2px 8px rgba(141,255,199,.25)}
.ph{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:700 19px var(--display);color:var(--silver2);letter-spacing:.03em;text-shadow:0 0 12px rgba(141,255,199,.35)}
.ph::before{content:"✦";font-family:var(--read);font-size:12px;color:var(--em2);text-shadow:0 0 8px var(--em)}
.ph::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,211,230,.7),transparent)}
.rune{position:absolute;right:-30px;top:-30px;width:160px;height:160px;opacity:.07;pointer-events:none;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* vitals */
.vit{display:flex;justify-content:space-between;align-items:flex-end}
.hpNum{font:700 50px/0.95 var(--head);color:var(--silver2);text-shadow:0 0 18px rgba(111,182,255,.45)}
.hpNum small{font-size:22px;color:var(--muted)}
.bigHp{position:relative;height:22px;margin:10px 0 12px;background:#040716;border:1px solid var(--silver);border-radius:11px;overflow:hidden;box-shadow:0 0 14px rgba(111,182,255,.3)}
.bigHp::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.4) 45%,transparent 60%);background-size:250% 100%;animation:glint 5s linear infinite}
@keyframes glint{0%{background-position:140% 0}100%{background-position:-140% 0}}
.amt{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.st{text-align:center;padding:8px 2px;border:1px solid rgba(201,211,230,.3);border-radius:3px;background:rgba(4,7,22,.45)}
.st b{display:block;font:700 22px var(--head);color:var(--silver2)}
.st span{font:600 10px var(--head);letter-spacing:.1em;color:var(--muted)}

/* wild magic panel */
.pool{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pool .lbl{font:600 13px var(--head);letter-spacing:.06em;color:var(--silver);margin-right:4px}
.gemB{background:none;border:none;box-shadow:none;padding:3px;min-height:0}
.gemB i{display:block;width:16px;height:24px;clip-path:polygon(50% 0,100% 28%,82% 100%,18% 100%,0 28%);background:linear-gradient(160deg,#c9ffe6,#2fd48a 50%,#0f7a4c);filter:drop-shadow(0 0 6px var(--em))}
.gemB.used i{background:#16204a;filter:none}
.gemB.flare i{animation:flare .7s ease-out}
@keyframes flare{0%{filter:brightness(3) drop-shadow(0 0 14px #fff);transform:scale(1.6)}100%{transform:none}}
.pw{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid rgba(201,211,230,.15)}
.pw .n{font:700 16px var(--head);color:var(--silver2)}
.pw .d{font:400 13.5px/1.45 var(--read);color:#b9c4dd}
.pw .d b{color:var(--em2);font-weight:600}
.pw .btns{grid-row:span 2;display:flex;gap:6px}
.status{font:600 11px var(--read);letter-spacing:.04em;padding:2px 7px;border-radius:2px;margin-left:6px;vertical-align:2px}
.status.ok{background:var(--emD);color:#dfffee}.status.no{background:#3a2440;color:#e3c9ec}
.try p{font:400 13.5px/1.45 var(--read);color:var(--muted);margin:0 0 10px}
.try .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{font:400 13px/1.5 var(--read);color:#b9c4dd;display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px dashed rgba(201,211,230,.4);border-radius:4px;background:rgba(4,7,22,.5)}
.banner img{width:56px;height:56px;border-radius:24%;flex:none;box-shadow:0 0 0 1px var(--silver),0 0 14px rgba(47,212,138,.4)}

/* ---------- dialogs: moonlit glass ---------- */
.dlgBack{position:fixed;inset:0;z-index:70;background:rgba(2,4,14,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.dlgBack.open{display:flex}
.dlg{width:100%;max-width:400px;padding:18px;border:1px solid var(--silver);border-radius:6px;background:linear-gradient(180deg,#16245a,#0a1233);box-shadow:0 0 0 4px rgba(7,11,31,.9),0 0 0 5px rgba(201,211,230,.3),0 20px 50px rgba(0,0,0,.7),0 0 40px rgba(47,212,138,.15);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.dlg h3{margin:0 0 6px;font:700 22px var(--display);color:var(--silver2)}
.dlg .sub{font:400 14px/1.5 var(--read);color:#b9c4dd;margin-bottom:12px}
.opts{display:flex;gap:8px;margin-bottom:12px}
.opts button{flex:1;padding:10px 4px}
.opts button.on{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em2)}
.dlgBtns{display:flex;justify-content:flex-end;gap:8px}

/* ---------- effect layers ---------- */
.ov{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0}
/* soft dark backdrop behind the big results */
#dim{background:radial-gradient(ellipse at 50% 42%,rgba(3,5,16,.82),rgba(3,5,16,.55) 60%,rgba(3,5,16,.3));z-index:57}
#dim.go{animation:dimA var(--dur,3.6s) ease-in-out forwards}
@keyframes dimA{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
/* wild magic surge */
#chaos{background:conic-gradient(from 0deg,#2fd48a,#6f5bff,#ff4fd8,#ffb347,#2fd48a,#4fd8ff,#2fd48a);mix-blend-mode:screen;filter:blur(30px)}
#chaos.go{animation:chaos 3.4s ease-in-out forwards}
@keyframes chaos{0%{opacity:0;transform:scale(.6) rotate(0)}15%{opacity:.55}30%{opacity:.25}45%{opacity:.6}70%{opacity:.4;transform:scale(1.6) rotate(240deg)}100%{opacity:0;transform:scale(2) rotate(360deg)}}
.glitch{animation:glitch 1.3s steps(1) forwards}
@keyframes glitch{0%{filter:hue-rotate(0)}8%{filter:hue-rotate(90deg) saturate(2);transform:translate(4px,-2px) skewX(2deg)}16%{filter:hue-rotate(-140deg) saturate(1.6);transform:translate(-6px,2px)}24%{filter:invert(.15) hue-rotate(200deg);transform:translate(3px,3px) skewX(-3deg)}32%{filter:hue-rotate(40deg);transform:none}44%{filter:hue-rotate(-60deg) saturate(2.4);transform:translate(-3px,-3px)}56%{filter:none;transform:translate(2px,0)}70%{filter:hue-rotate(120deg);transform:skewX(1deg)}84%{filter:none;transform:none}100%{filter:none;transform:none}}
#d100{position:fixed;left:0;right:0;top:34vh;text-align:center;z-index:64;pointer-events:none;opacity:0}
#d100 .num{font:700 96px/1 var(--head);color:#fff;text-shadow:0 0 14px #fff,0 0 30px var(--em),0 0 60px #6f5bff}
#d100 .lab{font:700 15px var(--head);letter-spacing:.3em;color:var(--em2);text-shadow:0 0 10px var(--em);margin-bottom:6px}
#d100 .res{max-width:340px;margin:12px auto 0;font:500 15px/1.45 var(--read);color:#eaf0ff;background:rgba(7,11,31,.78);border:1px solid rgba(201,211,230,.5);border-radius:4px;padding:10px 12px;opacity:0;transition:opacity .4s}
#d100.show .res{opacity:1}
#d100.go{animation:dIn 5.2s ease-out forwards}
@keyframes dIn{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1)}88%{opacity:1}100%{opacity:0}}
/* tides of chaos */
#tide{position:fixed;inset:-10% -60%;z-index:56;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(141,255,199,.0) 36%,rgba(141,255,199,.45) 44%,rgba(238,243,255,.85) 50%,rgba(111,182,255,.5) 56%,transparent 66%)}
#tide.go{animation:tide 1.9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes tide{0%{opacity:1;transform:translateX(-70%) skewX(-12deg)}100%{opacity:1;transform:translateX(70%) skewX(-12deg)}}
#tideTxt{position:fixed;left:0;right:0;top:40vh;text-align:center;z-index:64;pointer-events:none;opacity:0;font:700 46px var(--display);color:#fff;letter-spacing:.06em;text-shadow:0 0 12px #fff,0 0 30px var(--em),0 0 60px #4fd8ff}
#tideTxt small{display:block;font:600 14px var(--head);letter-spacing:.28em;color:var(--em2)}
#tideTxt.go{animation:tTxt 2.6s ease-out forwards}
@keyframes tTxt{0%,20%{opacity:0;transform:translateY(16px) scale(.9)}35%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
/* bend luck */
#threads{position:fixed;inset:0;width:100%;height:100%;z-index:57;pointer-events:none;opacity:0}
#threads.go{animation:thr 3.6s ease-in-out forwards}
@keyframes thr{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#threads path{fill:none;stroke-linecap:round}
#d4{position:fixed;left:50%;top:40vh;width:150px;height:150px;margin:-75px 0 0 -75px;z-index:63;pointer-events:none;opacity:0}
#d4.go{animation:d4 3.6s ease-out forwards}
@keyframes d4{0%{opacity:0;transform:scale(.3) rotate(-200deg)}25%{opacity:1;transform:scale(1.1) rotate(20deg)}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
#d4txt{position:fixed;left:0;right:0;top:calc(40vh + 82px);text-align:center;z-index:64;pointer-events:none;opacity:0;font:700 40px var(--display);color:#fff;text-shadow:0 0 12px #fff,0 0 30px var(--em)}
#d4txt small{display:block;font:600 13px var(--head);letter-spacing:.24em;color:var(--silver)}
#d4txt.go{animation:tTxt 3.6s ease-out forwards}

/* shared centre-stage pieces */
#bigTxt{position:fixed;left:0;right:0;top:calc(40vh + 86px);text-align:center;z-index:64;pointer-events:none;opacity:0;font:700 34px var(--display);color:#fff;letter-spacing:.04em;text-shadow:0 0 12px #fff,0 0 30px var(--glow,#2fd48a)}
#bigTxt small{display:block;font:600 13px var(--head);letter-spacing:.26em;color:var(--sub,#c9d3e6);margin-top:4px}
#bigTxt.go{animation:tTxt var(--dur,3.2s) ease-out forwards}
/* subtle spell */
#sigil{position:fixed;left:50%;top:40vh;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:63;pointer-events:none;opacity:0}
#sigil.go{animation:sigil 3.4s ease-in-out forwards}
@keyframes sigil{0%{opacity:0;transform:scale(.6) rotate(-40deg)}20%{opacity:1;transform:scale(1) rotate(0);filter:drop-shadow(0 0 14px #2fd48a)}55%{opacity:1;filter:drop-shadow(0 0 4px #2fd48a)}85%{opacity:.25;transform:scale(.9) rotate(20deg);filter:none}100%{opacity:0;transform:scale(.85) rotate(30deg)}}
.shush{animation:shush 3.4s ease-in-out}
@keyframes shush{0%,15%{filter:none;opacity:1}45%,70%{filter:blur(2.5px) saturate(.3) brightness(.7);opacity:.55}100%{filter:none;opacity:1}}
.ringIn{position:fixed;left:50%;top:40vh;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;border:1.5px solid rgba(230,240,255,.8);z-index:62;pointer-events:none;opacity:0;box-shadow:0 0 14px rgba(201,211,230,.6)}
.ringIn.go{animation:ringIn 1.6s ease-in forwards}
@keyframes ringIn{0%{opacity:0;transform:scale(1.4)}20%{opacity:.9}100%{opacity:0;transform:scale(.08)}}
/* transmute */
#orb{position:fixed;left:50%;top:40vh;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;z-index:62;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 40% 35%,#ffffff 0,var(--c1,#8dffc7) 18%,var(--c2,#2fd48a) 45%,rgba(0,0,0,0) 72%);filter:blur(1px);transition:background 0s}
#orb.go{animation:orb 3.6s ease-in-out forwards}
@keyframes orb{0%{opacity:0;transform:scale(.3) rotate(0)}15%{opacity:1;transform:scale(1)}40%{transform:scale(.8) rotate(120deg)}48%{transform:scale(1.25) rotate(160deg)}80%{opacity:1;transform:scale(1.05) rotate(200deg)}100%{opacity:0;transform:scale(1.6) rotate(240deg)}}
#elemGlow{z-index:56}
#elemGlow.go{animation:dimA 3.6s ease-in-out forwards}
#frost{background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(220,240,255,.55) 80%,rgba(255,255,255,.85) 100%);z-index:58}
#frost.go{animation:dimA 3s ease-in-out forwards}
.elist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.elist button{padding:10px 4px;font-size:13.5px}
.elist button.on{border-color:var(--em2);box-shadow:0 0 12px rgba(47,212,138,.5)}
.elist .gl{display:block;font-size:22px;font-family:var(--read);margin-bottom:2px}
/* magical guidance */
#d20{position:fixed;left:50%;top:40vh;width:170px;height:170px;margin:-85px 0 0 -85px;z-index:63;pointer-events:none;opacity:0}
#d20.fail{animation:dFail 1.2s ease-out forwards}
@keyframes dFail{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1)}60%{transform:translateX(-4px) rotate(-3deg)}70%{transform:translateX(4px) rotate(3deg)}90%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.15)}}
#d20.new{animation:dNew 2.4s ease-out forwards}
@keyframes dNew{0%{opacity:0;transform:scale(.2) rotate(-540deg)}45%{opacity:1;transform:scale(1.1) rotate(10deg)}55%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0}}
#d20 .crack{opacity:0}#d20.fail .crack{animation:crack 1.2s forwards}
@keyframes crack{0%,45%{opacity:0}55%,100%{opacity:1}}
/* bend luck: two moods */
#d4 .dark{display:none}#d4.hinder .light{display:none}#d4.hinder .dark{display:inline}
#d4.hinder.go{animation:d4h 3.6s ease-out forwards}
@keyframes d4h{0%{opacity:0;transform:translateY(-60px) scale(1.2) rotate(30deg)}22%{opacity:1;transform:translateY(6px) scale(1) rotate(-4deg)}30%{transform:translateY(0) rotate(0)}40%{transform:translateX(-5px)}44%{transform:translateX(5px)}48%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(30px) scale(.95)}}
#d4.help.go{animation:d4u 3.6s ease-out forwards}

  padding:10px 16px;font:500 14px/1.4 var(--read);color:#eaf0ff;background:linear-gradient(#16245a,#0a1233);border:1px solid var(--silver);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.8),0 0 16px rgba(47,212,138,.25)}

@font-face{font-family:"Cinzel Decorative";src:url(fonts/cinzel-decorative-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

/* menu */
.menu{position:fixed;top:calc(58px + env(safe-area-inset-top));left:12px;z-index:40;width:276px;display:none;padding:8px;border:1px solid var(--silver);border-radius:6px;
  background:linear-gradient(180deg,#16245a,#0a1233);box-shadow:0 0 0 3px rgba(7,11,31,.9),0 0 0 4px rgba(201,211,230,.25),0 16px 40px rgba(0,0,0,.7),0 0 30px rgba(47,212,138,.15)}
.menu.open{display:block;animation:rise .2s ease-out}
.menu button,.menu label.mb{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;box-shadow:none;border-bottom:1px solid rgba(201,211,230,.15);border-radius:0;
  padding:11px 8px;font:600 14.5px var(--head);color:var(--silver2);text-align:left;cursor:pointer;min-height:0;letter-spacing:.04em}
.menu .ic{width:22px;text-align:center;font-family:var(--read);color:var(--em2)}
.menu .sw{margin-left:auto;width:38px;height:20px;border:1px solid var(--silverD);border-radius:10px;position:relative;background:#040716;flex:none}
.menu .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
.menu .sw.on{background:var(--emD);border-color:var(--em)}.menu .sw.on::after{left:20px;background:var(--em2);box-shadow:0 0 8px var(--em)}
.menu .st8{font:400 12.5px/1.5 var(--read);color:var(--muted);padding:8px 8px 2px}
.menu .st8 b{color:var(--em2);font-weight:500}.menu .st8 .bad{color:#ff8a9a}
/* inputs */
input,textarea,select{font:400 15.5px var(--read);color:var(--ink);background:rgba(4,7,22,.55);border:none;border-bottom:1px solid rgba(201,211,230,.45);border-radius:0;padding:6px 7px;width:100%;min-width:0;text-align:left}
select option{background:#0d1636;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.45;border:1px solid rgba(201,211,230,.35);border-radius:3px}
input::placeholder,textarea::placeholder{color:#5f6c8f;font-style:italic}
input:focus,textarea:focus,select:focus{outline:none;border-bottom-color:var(--em2);box-shadow:0 2px 10px -3px var(--em);background:rgba(47,212,138,.06)}
textarea:focus{border-color:var(--em)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--em);padding:0;flex:none}
input[type=number]{font-variant-numeric:tabular-nums}
button.gold{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em);color:#e6fff3;box-shadow:0 0 12px rgba(47,212,138,.3),inset 0 1px 0 rgba(200,255,230,.3)}
button.green{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em2);color:#e6fff3}
button.mini{padding:3px 12px;min-height:32px;font-size:13px}
button.x{border:none;background:none;box-shadow:none;color:var(--muted);font:400 24px var(--read);padding:0 6px;line-height:1;min-height:0}
button.x:hover{color:#ff8a9a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.f{display:flex;flex-direction:column;gap:2px}
.f label,.lbl{font:600 12px var(--head);letter-spacing:.07em;color:var(--silver)}
.note{font:400 13.5px/1.45 var(--read);color:var(--muted)}
.note b{color:var(--em2);font-weight:600}
.note .over{color:#ff8a9a}
.sub2{font:700 14px var(--head);letter-spacing:.06em;color:var(--silver2);margin-top:6px;border-bottom:1px solid rgba(201,211,230,.25);padding-bottom:3px}
/* sorcery crystals, slots */
.poolRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.poolRow .cnt{margin-left:auto;font:700 18px var(--head);color:var(--em2);text-shadow:0 0 10px var(--em)}
.pipB{background:none;border:none;box-shadow:none;padding:4px;min-height:0;display:inline-grid;place-items:center}
.slRow .lv{min-width:46px}
.slRow .cnt{font:600 12px var(--read);color:var(--muted);white-space:nowrap}
.slRow input{width:56px;text-align:center}
.pw .btns{flex-wrap:wrap;justify-content:flex-end}
.pw .btns button{padding:6px 10px;font-size:13.5px}
/* vitals */
.bigHp em,.miniHp em{position:absolute;top:0;bottom:0;background:linear-gradient(rgba(220,240,255,.95),rgba(150,190,255,.75));transition:all .5s;box-shadow:0 0 8px #fff}
.amt input{font:600 18px var(--read);text-align:center;border-bottom:1px solid var(--silver)}
.hpTemp{font:500 13px var(--read);color:#bfe3ff;text-align:right}
.st small{display:block;font:400 10.5px var(--read);color:var(--muted)}
.death{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid #d46a7d;border-radius:3px;background:rgba(110,26,42,.25);margin-top:10px}
.death .lbl{color:#ffc2cd}
.pips{display:flex;gap:6px;align-items:center}
#ovLow{z-index:44;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(150,40,70,.5) 100%)}
#ovLow.on{animation:lowA 1.6s ease-in-out infinite}
@keyframes lowA{0%,100%{opacity:.25}50%{opacity:.85}}
/* concentration */
.conc{display:flex;align-items:center;gap:14px;padding:12px 14px;min-width:0;border:1px solid rgba(141,255,199,.55);border-radius:4px;background:linear-gradient(90deg,rgba(47,212,138,.16),rgba(47,212,138,.03));animation:rise .3s ease-out}
.conc .rn{width:50px;height:50px;flex:none;animation:spin 14s linear infinite;filter:drop-shadow(0 0 6px rgba(47,212,138,.8))}
.conc .t{flex:1;min-width:0}
.conc .t b{display:block;font:700 16px var(--head);color:var(--silver2)}
.conc .t span{font:400 13.5px/1.35 var(--read);color:#b9c4dd}
/* conditions */
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.cchip{border:1px solid rgba(201,211,230,.3);background:rgba(4,7,22,.45);color:var(--muted);font:500 13px var(--read);padding:6px 10px;min-height:0;letter-spacing:0;box-shadow:none;border-radius:14px}
.cchip.on{border-color:#d46a7d;color:#ffe1e7;background:linear-gradient(#6e1a2a,#2c0812);box-shadow:0 0 12px rgba(212,106,125,.45)}
.condList{display:grid;gap:6px}
.cond{font:400 14px/1.45 var(--read);color:#d6dcef;padding:8px 10px;border-left:3px solid #d46a7d;background:rgba(110,26,42,.18)}
.cond b{color:#ffc2cd;font-weight:600}
/* attacks / ready */
.atk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(201,211,230,.15)}
.atk:last-child{border-bottom:none}
.atk .n{font:700 16px var(--head);color:var(--silver2)}
.atk .d{font:400 14px/1.4 var(--read);color:#b9c4dd}
.atk .d b{color:var(--em2);font-weight:600}
.atkEd{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px;padding:8px;border:1px solid rgba(201,211,230,.25);border-radius:3px;background:rgba(4,7,22,.35)}
.atkEd .a-name,.atkEd .a-dmg,.atkEd .a-note{grid-column:1/3}
.atkEd .a-x{grid-column:3;grid-row:1}
.ready{display:flex;flex-wrap:wrap;gap:6px}
.ready button{font-size:13.5px;padding:5px 10px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.ready button i{width:8px;height:8px;border-radius:50%;flex:none}
.ready button small{font:400 11px var(--read);color:var(--muted)}
/* character */
.idname input{font:700 clamp(30px,8vw,48px) var(--display);text-align:center;background:none;border:none;color:var(--silver2);padding:0;text-shadow:0 0 22px rgba(141,255,199,.35)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.abils{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.abils{grid-template-columns:repeat(6,1fr)}}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px}
.ab .in{width:100%;max-width:130px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:1px solid rgba(201,211,230,.45);
  background:radial-gradient(ellipse at 50% 0,rgba(47,212,138,.14),rgba(4,7,22,.6) 70%);clip-path:polygon(50% 0,100% 14%,100% 86%,50% 100%,0 86%,0 14%);padding-top:14px;padding-bottom:16px}
.ab .lbl{font-size:10.5px}
.ab .mod{font:700 30px var(--head);color:var(--silver2);line-height:1.05;text-shadow:0 0 12px rgba(141,255,199,.4)}
.ab input[type=number]{text-align:center;width:56px;border:1px solid rgba(201,211,230,.45)}
.ab .save{display:flex;align-items:center;gap:5px;font:400 13.5px var(--read);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.skills{display:grid;gap:1px}
.sk{display:grid;grid-template-columns:40px 1fr 50px 78px;gap:6px;align-items:center;padding:2px 4px;min-height:40px}
.sk:nth-child(odd){background:rgba(255,255,255,.03)}
.sk .tot{text-align:right;font:700 17px var(--read);color:var(--silver2)}
.sk .nm{font:400 15px var(--read)}
.sk .ab3{font-size:11px;color:var(--muted);letter-spacing:.05em}
.sk.p .nm,.sk.e .nm{font-weight:600;color:var(--em2)}
.sk input{padding:3px;text-align:center}
.sk .prof{padding:2px 4px;font-size:12.5px;min-height:32px;display:flex;align-items:center;justify-content:center;gap:5px}
.sk .prof .pg{font-family:var(--read);font-size:15px;color:var(--muted)}
.sk .prof.on{border-color:var(--em)}.sk .prof.on .pg{color:var(--em2)}
.sk .prof.ex{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em2)}.sk .prof.ex .pg{color:#fff}
.feat{border-left:2px solid var(--em);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.feat .row{flex-wrap:nowrap}
.feat .row input,.bond .row input,.perk .row input,.train .row input{font:600 15px var(--head);color:var(--silver2)}
.feats{display:grid;gap:12px}
@media (min-width:700px){.feats{grid-template-columns:1fr 1fr}}
.train{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;border-bottom:1px solid rgba(201,211,230,.15)}
.train .row{flex-wrap:nowrap}
.trow{display:grid;grid-template-columns:62px 1fr 110px;gap:8px;align-items:center}
.bar{height:10px;border:1px solid var(--silverD);border-radius:5px;background:#040716;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2d5fd1,#6fb6ff)}
.bar.ex i{background:linear-gradient(90deg,#0f7a4c,#8dffc7)}
.tn{display:flex;gap:4px;align-items:center;white-space:nowrap;font:400 14px var(--read)}.tn input{width:56px;text-align:center}
/* spells */
.sgroup{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.sglvl{font:700 13px var(--head);letter-spacing:.08em;color:var(--silver);border-bottom:1px solid rgba(201,211,230,.25);padding-bottom:2px}
.spell{display:grid;grid-template-columns:12px 1fr auto auto 26px;gap:6px;align-items:center}
.spell .dot{width:9px;height:9px;border-radius:50%}
.spell .castb{font-size:13px;padding:2px 10px;min-height:32px}
button.tag{font-size:12px;padding:2px 8px;min-height:30px}
button.tag.on{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em2)}
.readbtn{justify-self:stretch;font-size:12.5px;padding:0 10px;min-height:30px!important;background:none;border-color:rgba(201,211,230,.35);color:var(--silver)}
.readbtn.open{border-color:var(--em2);color:var(--em2)}
.sdesc{grid-column:1/-1}
.sdesc textarea{min-height:150px;font-size:15px}
.extra{display:grid;grid-template-columns:1fr 70px 28px;gap:6px;align-items:center;border:1px solid rgba(201,211,230,.25);border-radius:3px;padding:6px;background:rgba(4,7,22,.3)}
.extra .e-note{grid-column:1/3}.extra .x{grid-column:3;grid-row:1}
.extra .e-tags{grid-column:1/-1}
.extra .readbtn{grid-column:1/-1;justify-self:start}
.uses{display:flex;gap:6px;align-items:center;white-space:nowrap;font:400 14px var(--read);color:var(--muted)}
.uses input[type=number]{width:48px;text-align:center}
.sE{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid rgba(141,255,199,.35);border-radius:3px;background:rgba(4,7,22,.45)}
.sE-tags{display:flex;flex-wrap:wrap;gap:5px}
.sT{font:600 11.5px var(--read);letter-spacing:.02em;padding:2px 7px;border-radius:2px;background:#1c2b63;color:#dfe6f5;border:1px solid rgba(201,211,230,.3)}
.sT.c{background:#6e1a2a;color:#ffe1e7;border-color:#d46a7d}
.sE-sum{margin:0;font:500 15.5px/1.4 var(--read);color:#eef3ff}
.sE-plain{margin:0;font:400 14px/1.5 var(--read);color:#c3cce2;white-space:pre-wrap}
.sE details{font:400 14px/1.45 var(--read);color:#c3cce2;border-top:1px dashed rgba(201,211,230,.3);padding-top:6px}
.sE summary{cursor:pointer;color:var(--em2);font-weight:600;font-size:13.5px}
.sE ol{margin:6px 0 4px;padding-left:20px}.sE li{margin:3px 0}
.sE-up{font-size:13.5px;background:rgba(47,212,138,.1);border-left:3px solid var(--em);padding:5px 8px;margin-top:6px}
.sE-up b{color:var(--em2)}
.sE-needs{font-size:12.5px;color:var(--muted);margin-top:5px}
.muted{color:var(--muted)}
/* roleplay / gear / camp */
.allyRow{display:grid;grid-template-columns:1fr 64px 28px;gap:6px;align-items:center}
.allyRow .an{grid-column:1/3}
.allies{display:grid;gap:10px}
.bond{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid rgba(201,211,230,.15)}
.bond .row{flex-wrap:nowrap}
.bpval{font:700 28px var(--head);color:var(--em2);min-width:56px;text-align:right;font-variant-numeric:tabular-nums;flex:none;line-height:1}
.bstep{flex-wrap:nowrap}
.bstep button{min-width:46px;font:700 20px var(--read)}
.bpamt{width:86px!important;text-align:center;flex:none;border:1px solid rgba(201,211,230,.35)!important}
.bond textarea,.perk textarea{min-height:44px}
.seals{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seal{position:relative;min-height:0;padding:6px 14px 6px 32px;font:600 13px var(--head);color:#e6fff3;background:linear-gradient(#1a7a52,#0b3d2a);border:1px solid var(--em2);box-shadow:0 0 10px rgba(47,212,138,.35)}
.seal::before{content:"✦";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#fff;text-shadow:0 0 8px var(--em2)}
.seal.used{color:#7f8aa6;background:#0b1233;border-color:#3a4672;box-shadow:none;text-decoration:line-through}
.seal.used::before{color:#3a4672;text-shadow:none}
.perk{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px solid rgba(201,211,230,.15)}
.perk .row{flex-wrap:nowrap}
.bp{width:76px;flex:none}.bp input{text-align:center;font-weight:700;color:var(--em2)}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coins input{text-align:center}
.acitem{display:grid;grid-template-columns:auto 1fr 28px;gap:6px;align-items:center;padding:6px;border:1px solid rgba(201,211,230,.25);border-radius:3px;background:rgba(4,7,22,.3)}
.acitem .ai-type{grid-column:1/2}.acitem .ai-val{grid-column:2/3}.acitem .x{grid-column:3;grid-row:1}
.wear{min-width:78px;font-size:13px}
.wear.on{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em2)}
.logE{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid rgba(201,211,230,.25);border-radius:3px;background:rgba(4,7,22,.35)}
.logE .hd{display:grid;grid-template-columns:auto 70px 1fr auto;gap:8px;align-items:center}
.logE .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.delb.armed{color:#fff;background:linear-gradient(#a3192f,#5a0a15);border:1px solid #e05a6a;font:500 13px var(--read);padding:4px 8px}
.foot{margin:10px 0 0;text-align:center;font:italic 400 13.5px var(--read);color:var(--muted)}
.foot::before{content:"✦";display:block;color:var(--em2);font-size:22px;font-style:normal;text-shadow:0 0 10px var(--em)}
.surgeOut{font:400 14px/1.5 var(--read);color:#dfe6f5;padding:8px 10px;border-left:3px solid var(--em);background:rgba(47,212,138,.08)}
/* dialogs */
.dlg{padding:0;max-width:440px}
.dlg .di{padding:18px;max-height:86vh;overflow-y:auto}
.dlg .warn{font:500 13.5px/1.45 var(--read);color:#ffd0d8;background:rgba(110,26,42,.3);border-left:3px solid #d46a7d;padding:6px 10px;margin-bottom:10px}
.lvls{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.lvl{flex:1;padding:8px 4px;font:600 14px var(--read);min-height:0;letter-spacing:0}
.lvl small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.lvl.on{background:linear-gradient(#1a7a52,#0b3d2a);border-color:var(--em2);color:#fff}
.lvl.on small{color:#c9ffe6}
.dmg{font:400 15px/1.5 var(--read);color:#dfe6f5;background:rgba(4,7,22,.5);border-left:3px solid var(--em);padding:8px 10px;margin-bottom:10px}
.dmg b{font-size:20px;color:var(--em2)}
.dchk{display:flex;align-items:center;gap:8px;font:400 14.5px var(--read);margin-bottom:10px}
.dlgBtns{flex-wrap:wrap;margin-top:6px}
.dlg input{margin-bottom:10px}
.dlg [data-srroll]{flex:none;white-space:nowrap;padding:8px 12px}
.dlg .sE{margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);z-index:80;max-width:92vw;padding:10px 16px;border-radius:4px;
  font:500 14px/1.4 var(--read);color:#eef3ff;background:rgba(10,18,51,.96);border:1px solid var(--silver);box-shadow:0 0 18px rgba(47,212,138,.3);opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}
#printFrame{position:fixed;width:0;height:0;border:0;visibility:hidden}
body.calm .conc .rn{animation:none}
@media (max-width:420px){.amt{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}

</style>
</head>

const SPELL_SUMMARY = {
"Fire Bolt":"1 action · 120 ft · instant\nHurl a mote of fire: ranged spell attack ({atk}), 2d10 fire on a hit.\n- Make a ranged spell attack ({atk}) against a creature or object within 120 ft.\n- On a hit it takes 2d10 fire damage (3d10 from 11th level).\n- A flammable object that isn't worn or carried catches fire.\nNeeds: V, S",
"Frostbite":"1 action · 60 ft · instant\nNumbing frost: CON save (DC {dc}) or 2d6 cold and disadvantage on its next weapon attack.\n- Pick a creature you can see within 60 ft.\n- It makes a Constitution save against DC {dc}.\n- On a fail: 2d6 cold damage, and disadvantage on the next weapon attack it makes before the end of its next turn.\nNeeds: V, S",
"Mending":"1 minute · touch · instant\nFix one break or tear in an object you touch.\n- Repairs a single break or tear no bigger than 1 ft in any direction: a broken chain link, a torn cloak, a cracked key.\n- Leaves no trace of the damage. Can fix a magic item's body, but not its magic.\nNeeds: V, S, M (two lodestones)",
"Infestation":"1 action · 30 ft · instant\nA cloud of mites: CON save (DC {dc}) or 2d6 poison and it lurches 5 ft at random.\n- Pick a creature you can see within 30 ft.\n- It makes a Constitution save against DC {dc}.\n- On a fail: 2d6 poison damage, and it moves 5 ft in a random direction (roll a d4) if it can, without provoking opportunity attacks.\nNeeds: V, S, M (a living flea)",
"Light":"1 action · touch · 1 hour\nAn object you touch glows: bright light 20 ft, dim light 20 ft more.\n- Touch an object no bigger than 10 ft; pick the light's colour.\n- Covering it fully blocks the light. Casting it again ends the old one.\n- If a hostile creature is holding or wearing the object, it can make a DEX save (DC {dc}) to avoid it.\nNeeds: V, M (a firefly or phosphorescent moss)",
"Chill Touch":"1 action · 120 ft · 1 round\nA ghostly hand: ranged spell attack ({atk}), 2d8 necrotic and no healing.\n- Make a ranged spell attack ({atk}) against a creature within 120 ft.\n- On a hit: 2d8 necrotic damage, and it can't regain HP until the start of your next turn.\n- If the target is undead, it also has disadvantage on attacks against you until the end of your next turn.\nNeeds: V, S",
"Blade Ward":"1 action · self · 1 round\nResistance to weapon damage until the end of your next turn.\n- Trace a sigil of warding.\n- Until the end of your next turn, you take half damage from bludgeoning, piercing and slashing damage dealt by weapon attacks.\nNeeds: V, S",
"Burning Hands":"1 action · self (15-ft cone) · instant\nA sheet of flame: DEX save (DC {dc}), 3d6 fire, half on a success.\n- Every creature in a 15-ft cone in front of you makes a Dexterity save against DC {dc}.\n- On a fail it takes 3d6 fire damage; on a success, half.\n- Flammable objects in the cone that aren't worn or carried catch fire.\nNeeds: V, S\nCast higher: +1d6 fire for each slot level above 1st.",
"Comprehend Languages":"1 action · self · 1 hour · ritual\nUnderstand any spoken language, and read writing you touch.\n- For the duration you understand the literal meaning of any spoken language you hear.\n- Touching written text lets you read it (about 1 minute per page).\n- Doesn't decode secret messages or reveal glyphs, such as an arcane sigil that isn't part of a written language.\nNeeds: V, S, M (a pinch of soot and salt)",
"Chaos Bolt":"1 action · 120 ft · instant\nA bolt of chaotic energy: ranged spell attack ({atk}), 2d8 + 1d6, the d8s pick the damage type.\n- Make a ranged spell attack ({atk}) against a creature within 120 ft.\n- On a hit: 2d8 + 1d6 damage. Pick one of the two d8s; its number sets the type: 1 acid, 2 cold, 3 fire, 4 force, 5 lightning, 6 poison, 7 psychic, 8 thunder.\n- If both d8s show the same number, the bolt leaps to a different creature of your choice within 30 ft of the target: make a new attack roll and roll new damage. It can keep leaping, but each creature can be hit only once per casting.\nNeeds: V, S\nCast higher: +1d6 damage for each slot level above 1st (on every target).",
"Magic Missile":"1 action · 120 ft · instant\nThree glowing darts that never miss: 1d4 + 1 force each.\n- Create three darts; each hits a creature you can see within 120 ft.\n- Each dart deals 1d4 + 1 force damage. They can all hit one creature or several.\nNeeds: V, S\nCast higher: one more dart for each slot level above 1st.",
"Detect Thoughts":"1 action · self · 1 minute · concentration\nRead surface thoughts of creatures within 30 ft, and probe deeper (WIS save DC {dc}).\n- On each of your turns, use an action to focus on one creature you can see within 30 ft and learn its surface thoughts.\n- To probe deeper, use your action again: it makes a Wisdom save against DC {dc}. On a fail you learn its reasoning, emotions and what's on its mind; on a success the spell ends.\n- You can also use an action to sense thinking creatures within 30 ft that you can't see.\n- Creatures with Intelligence 3 or lower, or no language, can't be read.\nNeeds: V, S, M (a copper piece)",
"Misty Step":"1 bonus action · self · instant\nTeleport up to 30 ft to a spot you can see, wrapped in silver mist.\n- Briefly surrounded by silvery mist, you teleport up to 30 ft to an unoccupied space you can see.\nNeeds: V",
"Tasha's Mind Whip":"1 action · 90 ft · 1 round\nPsychic lash: INT save (DC {dc}), 3d6 psychic and no reactions; on a fail its next turn is limited.\n- Pick a creature you can see within 90 ft. It makes an Intelligence save against DC {dc}.\n- On a fail: 3d6 psychic damage, it can't take reactions until the end of its next turn, and on its next turn it can only do one of: move, take an action, or take a bonus action.\n- On a success: half damage only.\nNeeds: V\nCast higher: one more creature for each slot level above 2nd (all within 30 ft of each other).",
"Melf's Minute Meteors":"1 action · self · up to 10 minutes · concentration\nSix tiny meteors orbit you; fling them for DEX save (DC {dc}), 2d6 fire each, half on a success.\n- Six meteors circle you for the duration.\n- When you cast it, and as a bonus action on each later turn, send one or two of them to points you choose within 120 ft.\n- Each one bursts in a 5-ft radius: every creature there makes a Dexterity save against DC {dc}, taking 2d6 fire on a fail or half on a success.\n- The spell ends early when the last meteor is used.\nNeeds: V, S, M (niter, sulphur, pine tar formed into a bead)\nCast higher: two more meteors for each slot level above 3rd.",
"Sickening Radiance":"1 action · 120 ft (30-ft radius) · up to 10 minutes · concentration\nDim greenish light: CON save (DC {dc}) or 4d10 radiant and a level of exhaustion.\n- A 30-ft-radius sphere of sickly light fills a point within 120 ft and spreads around corners.\n- A creature that enters it for the first time on a turn, or starts its turn there, makes a Constitution save against DC {dc}.\n- On a fail: 4d10 radiant damage, one level of exhaustion, and it gives off dim green light in a 5-ft radius so it can't hide or be invisible.\n- The exhaustion from this spell goes away when the spell ends.\nNeeds: V, S"
};
const SPELL_COLOR={"Fire Bolt":"#ff7a2a","Frostbite":"#9fd6ff","Chill Touch":"#b8ffe0","Infestation":"#a6d23a","Light":"#fff3c4","Mending":"#c9d3e6","Blade Ward":"#c9d3e6",
  "Burning Hands":"#ff8a3a","Comprehend Languages":"#8dffc7","Chaos Bolt":"chaos","Magic Missile":"#c9d3ff","Detect Thoughts":"#c38bff","Misty Step":"#e6ecf7",
  "Tasha's Mind Whip":"#c38bff","Melf's Minute Meteors":"#ff9a3a","Sickening Radiance":"#d8ff5a"};

const md = s => Math.floor(((Number(s)||0)-10)/2);
const sg = n => (n>=0?"+":"")+n;

function get(path){return path.split(".").reduce((o,k)=>o?.[k],S)}
function set(path,v){const ks=path.split(".");let o=S;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=v}

// ---------- derived ----------
function level(){const m=String(S.classLevel||"").match(/\d+/);return m?Math.max(1,+m[0]):7}
function skillTotal(k,ab){const sk=S.skills[k];return md(S.abil[ab].s)+(sk.p===1?S.prof:sk.p===2?S.prof*2:0)+(Number(sk.m)||0)}
function saveTotal(a){return md(S.abil[a].s)+(S.abil[a].save?S.prof:0)}
function hpMax(){return (Number(S.hpBase)||0)+(Number(S.hpBonus)||0)}
function hpCur(){return Number(S.hpCur)||0}
function acAuto(){const worn=S.acItems.filter(x=>x.worn);const sets=worn.filter(x=>x.type==="set").map(x=>Number(x.val)||0);
  const base=sets.length?Math.max(...sets):10+md(S.abil.dex.s);return base+worn.filter(x=>x.type==="add").reduce((t,x)=>t+(Number(x.val)||0),0)}
function acTotal(){const m=String(S.acManual??"").trim();return m!==""&&!isNaN(+m)?+m:acAuto()}
function passive(){return 10+skillTotal("perception","wis")+(Number(S.passiveMisc)||0)}
function spellDC(){return 8+S.prof+md(S.abil.cha.s)}
function spellAtk(){return S.prof+md(S.abil.cha.s)}
function knownCount(){return S.spells.filter(x=>lvlNum(x.lvl)>0).length}
function first(){return (S.name||"Lirael").split(" ")[0]}
function avail(s){return Math.max(0,(Number(s.max)||0)+(Number(s.x)||0)-(Number(s.used)||0))}
function spCur(){return Math.max(0,Number(S.sorc.cur)||0)}
const LVORDER=["cantrip","1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];
function lvlKey(l){const i=LVORDER.indexOf(String(l||"").trim().toLowerCase());return i<0?99:i}
function lvlNum(l){if(/cantrip/i.test(l))return 0;const n=parseInt(l);return isNaN(n)?1:n}
const ORD=n=>n+(n===1?"st":n===2?"nd":n===3?"rd":"th");
function isConc(sp){return /concentration/i.test(sp.desc||"")}
function spellGroups(arr,row){
  const groups={};arr.forEach((x,i)=>{const g=String(x.lvl||"Other").trim()||"Other";(groups[g]=groups[g]||[]).push([x,i])});
  return Object.keys(groups).sort((a,b)=>lvlKey(a)-lvlKey(b)).map(g=>`<div class="sgroup"><div class="sglvl">${esc(/^cantrip/i.test(g)?"Cantrips":g+" level")}</div>${groups[g].map(([x,i])=>row(x,i)).join("")}</div>`).join("")}
function spColor(name){const c=SPELL_COLOR[name];return !c||c==="chaos"?"#8dffc7":c}
function dotStyle(name){return SPELL_COLOR[name]==="chaos"?"background:conic-gradient(#ff6a1f,#9be31a,#9fd6ff,#c38bff,#ff6fd8,#ff6a1f);box-shadow:0 0 7px #ff6fd8":`background:${spColor(name)};box-shadow:0 0 7px ${spColor(name)}`}

// ---------- spell text, style E: tags + one line, full text behind a tap ----------
function fillNums(t){return String(t||"").replace(/\{dc\}/g,spellDC()).replace(/\{mod\}/g,sg(md(S.abil.cha.s))).replace(/\{atk\}/g,sg(spellAtk()))}
function parseSpell(desc){const L=fillNums(desc).split("\n").map(l=>l.trim()).filter(Boolean);
  if(L.length<2||!L[0].includes("·"))return {plain:L.join("\n")};
  const o={tags:L[0].split(/\s*·\s*/).filter(Boolean),sum:L[1],steps:[],needs:"",up:"",extra:[]};
  L.slice(2).forEach(l=>{if(/^[-•]\s*/.test(l))o.steps.push(l.replace(/^[-•]\s*/,""));else if(/^needs:/i.test(l))o.needs=l.replace(/^needs:\s*/i,"");else if(/^cast higher:/i.test(l))o.up=l.replace(/^cast higher:\s*/i,"");else o.extra.push(l)});
  return o}
function spellCard(desc,open){if(!desc)return `<div class="sE"><p class="sE-sum muted">No description yet.</p></div>`;const o=parseSpell(desc);
  if(o.plain!=null)return `<div class="sE"><p class="sE-plain">${esc(o.plain)}</p></div>`;
  const full=o.steps.length||o.needs||o.up||o.extra.length;
  return `<div class="sE"><div class="sE-tags">${o.tags.map(t=>`<span class="sT${/concentration/i.test(t)?" c":""}">${esc(t)}</span>`).join("")}</div>
    <p class="sE-sum">${esc(o.sum)}</p>
    ${full?`<details${open?" open":""}><summary>Full text</summary>${o.steps.length?`<ol>${o.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}${o.extra.map(x=>`<p class="sE-plain">${esc(x)}</p>`).join("")}${o.up?`<div class="sE-up"><b>Cast higher:</b> ${esc(o.up)}</div>`:""}${o.needs?`<div class="sE-needs">Needs: ${esc(o.needs)}</div>`:""}</details>`:""}</div>`}
function printDesc(desc){const o=parseSpell(desc);if(o.plain!=null)return esc(o.plain).replace(/\n/g,"<br>");
  return `<i>${esc(o.tags.join(" · "))}</i>. ${esc(o.sum)}${o.steps.length?"<br>"+o.steps.map(x=>"• "+esc(x)).join("<br>"):""}${o.up?"<br><i>Cast higher:</i> "+esc(o.up):""}`}
const SPELL_HINT="Line 1: tags separated by ·  ·  Line 2: the one-line summary  ·  lines starting with - are the steps  ·  Needs: …  ·  Cast higher: …  ·  {dc}, {atk} and {mod} fill in the spell DC, spell attack and Charisma.";
function spellPanel(key,desc){return `<div class="sdesc">${spellCard(desc,false)}
  <div class="row" style="margin-top:6px"><button class="mini" data-editspell="${key}">${editSpell.has(key)?"Done editing":"✎ Edit text"}</button></div>
  ${editSpell.has(key)?`${ta(key+".desc",8,"Write what this spell does")}<div class="note">${SPELL_HINT}</div>`:""}</div>`}

// ---------- surge table typed in by the player ----------
function surgeLookup(n){const lines=String(S.surgeTable||"").split("\n");
  for(const l of lines){const m=l.match(/^\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*[.:)\-–—]?\s+(.+)$/);if(!m)continue;
    let a=+m[1],b=m[2]!=null?+m[2]:a;if(a===0)a=100;if(b===0)b=100;if(n>=Math.min(a,b)&&n<=Math.max(a,b))return m[3].trim()}
  return ""}

// ---------- small builders ----------
const inp=(path,type="text",extra="")=>`<input id="i_${path.replace(/\./g,'_')}" data-k="${path}" type="${type}" value="${esc(get(path))}" ${extra}>`;
const ta=(path,rows=4,ph="")=>`<textarea id="i_${path.replace(/\./g,'_')}" data-k="${path}" rows="${rows}"${ph?` placeholder="${esc(ph)}"`:""}>${esc(get(path))}</textarea>`;
const fld=(label,path,type,extra)=>`<div class="f"><label for="i_${path.replace(/\./g,'_')}">${label}</label>${inp(path,type,extra)}</div>`;
const panel=(title,body,cls="",act="")=>`<section class="panel ${cls}"><h2 class="ph">${title}${act}</h2><div class="pi">${body}</div></section>`;
function pips(path,n){let h="";for(let i=1;i<=n;i++)h+=`<input type="checkbox" data-pip="${path}" data-n="${i}" ${get(path)>=i?"checked":""} aria-label="${path} ${i}">`;return `<span class="pips">${h}</span>`}
const RUNE=`<svg class="rn" viewBox="0 0 60 60" aria-hidden="true"><g fill="none" stroke="#8dffc7"><circle cx="30" cy="30" r="27" stroke-width="1.4"/><circle cx="30" cy="30" r="21" stroke-width=".8" stroke-dasharray="3 3"/>
  <path d="M30 6 L50 42 L10 42 Z M30 54 L10 18 L50 18 Z" stroke-width="1"/><circle cx="30" cy="30" r="4" fill="#8dffc7"/></g></svg>`;
function crystals(){let g="";const c=spCur(),m=Number(S.sorc.max)||0;for(let i=0;i<m;i++)g+=`<button class="gemB ${i<c?"":"used"}" data-sp="${i}" aria-label="${i<c?"Spend":"Restore"} a sorcery point"><i></i><svg class="ck" viewBox="0 0 16 24"><path d="M8 2 L6 9 L10 13 L7 19 L9 23 M6 9 L2 11 M10 13 L14 12"/></svg></button>`;return g}
function slotRows(edit){return S.slots.map((s,j)=>{const tot=(Number(s.max)||0)+(Number(s.x)||0),av=avail(s);let p="";
  for(let k=0;k<tot;k++)p+=`<button class="pipB" data-sl="${j}:${k}" aria-label="${k<av?"Use":"Restore"} a ${ORD(s.lvl)}-level slot"><i class="pip ${k<av?"":"used"} ${k>=s.max?"extra":""}" data-slp="${j}-${k}"></i></button>`;
  return `<div class="slRow"><span class="lv">${ORD(s.lvl)}</span>${p||'<span class="note">none</span>'}<span class="grow"></span>${edit?`<span class="note">max</span>${inp(`slots.${j}.max`,"number",'min="0" max="9" inputmode="numeric" aria-label="'+ORD(s.lvl)+' level slots max"')}`:`<span class="cnt">${av} / ${tot}</span>`}</div>`}).join("")}

    <div class="stats">
      <div class="st"><b>${acTotal()}</b><span>ARMOUR</span></div>
      <div class="st"><b>${sg(md(S.abil.dex.s)+(Number(S.initMisc)||0))}</b><span>INITIATIVE</span>${S.initNote?`<small>${esc(S.initNote)}</small>`:""}</div>
      <div class="st"><b>${esc(String(S.speed).replace(/\s*ft\.?/i,""))}</b><span>SPEED</span></div>
      <div class="st"><b>${spellDC()}</b><span>SPELL DC</span><small>attack ${sg(spellAtk())}</small></div>

  ${concBanner()}
  ${panel("Wild Magic",`

      <div class="d">Reroll a failed ability check; use the new roll.</div></div>
    <div class="pw"><div class="n">Metamagic</div><div class="btns"><button data-do="subtle" ${sp>=1?"":"disabled"}>Subtle</button><button data-do="trans" ${sp>=1?"":"disabled"}>Transmute</button></div>
      <div class="d"><b>Subtle</b> (1 SP): no verbal or somatic parts. <b>Transmute</b> (1 SP): swap acid, cold, fire, lightning, poison or thunder for another of them.</div></div>`)}

function header(){
  const max=hpMax(),cur=hpCur(),tmp=Number(S.hpTemp)||0;
  const pct=Math.max(0,Math.min(100,cur/(max||1)*100)),tp=Math.min(100-pct,tmp/(max||1)*100);
  $("#brand").textContent=S.name||"Lirael Frostheart";
  $("#acTop").textContent=acTotal();
  $("#miniHpBar").style.width=pct+"%";$("#miniTmp").style.left=pct+"%";$("#miniTmp").style.width=tp+"%";
  $("#miniHpTxt").textContent=`${cur} / ${max}`+(tmp?`  +${tmp}`:"");
  let t="";const c=spCur();for(let i=0;i<(Number(S.sorc.max)||0);i++)t+=`<i class="cr ${i<c?"":"used"}"></i>`;$("#crysTop").innerHTML=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===UI.tab));
  $("#ovLow").classList.toggle("on",cur>0&&cur<=max/4&&!calm());
  document.body.classList.toggle("calm",!!UI.calm);
  document.body.classList.toggle("down",cur<=0);
  $("#swCalm").classList.toggle("on",!!UI.calm);$("#swVib").classList.toggle("on",!!UI.vib);
  $("#lastBk").textContent=UI.lastBackup||"never";
  if(window.DRAGON_READY)DRAGON.sync();
}

// ===================== effects wired to the real sheet =====================
const calm=()=>!!UI.calm||matchMedia("(prefers-reduced-motion: reduce)").matches;
function vib(p){if(UI.vib&&!calm()&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toast(t,ms){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),ms||3600)}
function dim(sec){const e=$("#dim");e.style.setProperty("--dur",sec+"s");replay(e,"go")}
function replay(el,c){if(!el)return;el.classList.remove(c);el.getBoundingClientRect();el.classList.add(c)}
const lerp=(a,b,t)=>a+(b-a)*t,eo=t=>1-Math.pow(1-t,3),bz=(a,b,c,d,t)=>{const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d};
// is an element on screen (below the sticky header)?
function onScreen(el){if(!el)return false;const r=el.getBoundingClientRect(),tb=$(".top").getBoundingClientRect().bottom;return r.width>0&&r.top>=tb-4&&r.bottom<=H}
// a sorcery crystal: the big one in the Combat tab if visible, else the small one in the header
function spEl(k){const g=document.querySelector(`[data-sp="${k}"]`);return onScreen(g)?g:document.querySelectorAll("#crysTop .cr")[k]||null}
function gemRect(k){const e=spEl(k);return e?e.getBoundingClientRect():null}
function slotEl(j,k){const e=document.querySelector(`[data-slp="${j}-${k}"]`);return onScreen(e)?e:null}
function hpBar(){const b=$("#bigHp");return onScreen(b)?b:null}

// ---------- SORCERY CRYSTALS: crack when spent, light up when restored ----------
function spend(n){if(spCur()<n){toast(`Not enough sorcery points (needs ${n}).`);return false}
  const from=spCur();S.sorc.cur=from-n;changed(true);if(calm())return true;
  const tops=document.querySelectorAll("#crysTop .cr");
  for(let k=S.sorc.cur;k<from;k++){const g=document.querySelector(`[data-sp="${k}"]`),tp=tops[k],j=k-S.sorc.cur;
    setTimeout(()=>{if(g&&g.isConnected){g.classList.remove("used");replay(g,"breaking");const r=g.getBoundingClientRect();
        setTimeout(()=>spray(10,()=>({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2,life:1,decay:.03,r:1.3+Math.random(),kind:"emShard",g:.15})),220);
        setTimeout(()=>{g.classList.remove("breaking");g.classList.add("used")},820)}
      if(tp&&tp.isConnected){tp.classList.remove("used");replay(tp,"breaking");setTimeout(()=>{tp.classList.remove("breaking");tp.classList.add("used")},820)}},j*90)}
  vib(25);return true}
function gain(n,stagger){const from=spCur();S.sorc.cur=Math.min(Number(S.sorc.max)||0,from+n);changed(true);if(calm())return;stagger=stagger||160;
  const tops=document.querySelectorAll("#crysTop .cr");
  for(let k=from;k<S.sorc.cur;k++){const i=k-from;[document.querySelector(`[data-sp="${k}"]`),tops[k]].forEach(g=>{if(!g)return;g.style.setProperty("--dl",i*stagger+"ms");replay(g,"lit")});
    setTimeout(()=>{const r=gemRect(k);if(r)burst(r.left+r.width/2,r.top+r.height/2,9,"emer")},i*stagger+330)}}

// ---------- TIDES OF CHAOS ----------
function tides(){if(!S.tides){toast("Tides of Chaos is spent. A surge or a long rest brings it back.");return}
  S.tides=false;changed(true);
  if(calm()){toast("Tides of Chaos: take advantage on this roll.");return}
  replay($("#tide"),"go");vib([40,30,90]);dim(2.6);
  $("#tideTxt").innerHTML="ADVANTAGE<small>TIDES OF CHAOS</small>";replay($("#tideTxt"),"go");
  let i=0;const iv=setInterval(()=>{const x=W*(-.1+i*.08);for(let k=0;k<6;k++){parts.push({x:x+Math.random()*40,y:Math.random()*H,vx:4+Math.random()*3,vy:(Math.random()-.5)*1,life:1,decay:.012,r:1.5+Math.random()*2.5,kind:Math.random()<.5?"star":"emer"})}if(++i>14)clearInterval(iv)},70);
  setTimeout(()=>toast("Roll with advantage. Until it comes back, the DM may call for a surge after your 1st-level+ spells."),1900)}
function tidesBack(){S.tides=true;changed(true);if(calm()){toast("Tides of Chaos is ready again.");return}
  const tb=$("#tideBtn"),row=tb&&tb.closest(".pw"),tw=$("#twave");
  const box=onScreen(row)?(r=>({l:r.left-6,t:r.top+2,w:r.width+12,h:r.height-4}))(row.getBoundingClientRect()):{l:12,t:$(".top").getBoundingClientRect().bottom+10,w:W-24,h:46};
  Object.assign(tw.style,{left:box.l+"px",top:box.t+"px",width:box.w+"px",height:box.h+"px"});replay(tw,"go");vib([20,30,40]);
  setTimeout(()=>{replay($("#tideSt"),"back");spray(24,()=>({x:box.l+box.w*(.1+Math.random()*.8),y:box.t+box.h*.7,vx:-1-Math.random()*2,vy:-1-Math.random()*1.5,life:1,decay:.025,r:1.3+Math.random()*1.4,kind:Math.random()<.5?"emer":"silver"}))},650)}

// ---------- WILD MAGIC SURGE ----------
function surgeCheck(){const n=1+Math.floor(Math.random()*20);

    const k=Math.min(1,(t-2200)/800),e=1-Math.pow(1-k,3),f=t<3150?1:Math.max(0,1-(t-3150)/450);if(f<=0)return false;
    for(const p of P){const sw=(1-e)*70,x=p.x+(p.t.x-p.x)*e+Math.cos(p.a*3+t/200)*sw,y=p.y+(p.t.y-p.y)*e+Math.sin(p.a*3+t/200)*sw;

  if(d.fm){flexMode=d.fm;flexDlg();return}
  if(d.fl!=null){flexGo(+d.fl);return}
  if(d.bp){const i=+d.bp,b=S.bondPts[i];const amt=Math.max(1,Math.floor(Number(bpAmt[i])||1));
    b.points=Math.max(0,(Number(b.points)||0)+Number(d.d)*amt);changed(true);return}
  if(d.perkuse){const b=S.bondPts[+d.perkuse];b.used=b.used||{};b.used[d.perk]=!b.used[d.perk];changed(true);return}
  if(d.read){const k=d.read;if(openSpell.has(k)){openSpell.delete(k);editSpell.delete(k)}else openSpell.add(k);rerender();return}
  if(d.editspell){const k=d.editspell;editSpell.has(k)?editSpell.delete(k):editSpell.add(k);rerender();return}
  if(d.toggle){set(d.toggle,!get(d.toggle));changed(true);return}
  if(d.cycle){set(d.cycle,(get(d.cycle)+1)%3);changed(true);return}
  if(d.del){openSpell.clear();const [arr,i]=d.del.split(".");S[arr].splice(+i,1);changed(true);return}
  if(d.dellog!=null){const key="log."+d.dellog;if(armedDel===key){S.log.splice(+d.dellog,1);armedDel=null;changed(true)}else{armedDel=key;rerender()}return}
  if(d.add){const blank={attacks:{name:"",range:"",hit:"",dmg:"",note:""},spells:{lvl:(document.getElementById("newSpellLvl")||{}).value||"1st",name:"",desc:""},extraSpells:{lvl:"",name:"",note:"",always:false,uses:1,used:0,desc:""},features:{name:"New feature",text:""},allies:{name:"",rank:"",note:""},bondPts:{name:"",points:0,perks:"",used:{}},training:{name:"",normal:0,expert:0},perkTable:{at:0,name:"",desc:""},acItems:{name:"",type:"add",val:1,worn:true}}[d.add];
    if(blank){S[d.add].push(blank);changed(true)}return}
  const a=d.do;if(!a)return;
  if(a==="close")return closeDlg();
  if(a==="endConc"){S.conc="";changed(true);return}
  if(a==="editAtk"){editAtk=!editAtk;rerender();return}
  if(a==="castGo")return castGo(d.key);
  if(a==="srSpend")return srSpend();
  if(a==="tides")return tides();
  if(a==="tidesBack")return tidesBack();
  if(a==="surge")return surge();
  if(a==="surgeCheck")return surgeCheck();
  if(a==="bend")return bendDlg();
  if(a==="bendGo")return bendGo();
  if(a==="guide")return guidance();
  if(a==="subtle")return subtle();
  if(a==="trans")return transDlg();
  if(a==="transGo")return transGo();
  if(a==="flex"){if(!flexMode)flexMode="toPts";return flexDlg()}
  if(a==="addSlot"){const nl=(S.slots.length?Math.max(...S.slots.map(s=>s.lvl)):0)+1;if(nl>9)return;S.slots.push({lvl:nl,max:1,used:0,x:0});changed(true);return}
  if(a==="newLog"){const last=S.log[0],n=last&&!isNaN(parseInt(last.n))?String(parseInt(last.n)+1):"";
    S.log.unshift({n,date:new Date().toISOString().slice(0,10),text:"",loot:"",bond:""});changed(true);setTimeout(()=>{const t=$("#i_log_0_text");t&&t.focus()},50);return}
});
$("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;$("#menu").classList.remove("open");

// =====================================================================
// SAVING (on this device)
// =====================================================================
function status(t,cls){const p=$("#saveState");p.textContent=t;p.className=cls==="bad"?"bad":""}
let timer=null,dirty=false;
function changed(re){if(re)rerender();else dirty=true;schedule()}
app.addEventListener("focusout",e=>{if(!dirty)return;const to=e.relatedTarget;if(to&&app.contains(to)&&to.matches("input,textarea,select")){dirty=false;setTimeout(rerender,0);return}if(to&&app.contains(to))return;dirty=false;setTimeout(rerender,0)});
function schedule(){status("Saving…");clearTimeout(timer);timer=setTimeout(save,700)}
function save(){try{localStorage.setItem(SHEET_KEY,JSON.stringify(S));status("All changes saved","ok")}catch(e){status("Couldn't save. Use Backup!","bad");toast("Couldn't save on this phone. Make a Backup now.",6000)}}
function merge(d){const base=JSON.parse(JSON.stringify(DEFAULT));
  if(!d||typeof d!=="object")return base;
  // keep every field the app expects, even in older or hand-edited saves
  if(d.sorc&&typeof d.sorc!=="object")delete d.sorc;
  if(Array.isArray(d.slots))d.slots.forEach(s=>{s.used=Number(s.used)||0;s.x=Number(s.x)||0;s.max=Number(s.max)||0});
  ["spells","extraSpells","attacks","features","allies","bondPts","training","perkTable","acItems","conds","log"].forEach(k=>{if(d[k]!=null&&!Array.isArray(d[k]))delete d[k]});
  if(Array.isArray(d.bondPts))d.bondPts.forEach(b=>{b.used=b.used||{}});
  if(Array.isArray(d.allies))d.allies.forEach(a=>{if(a.note==null)a.note=""});
  ["spells","extraSpells"].forEach(k=>{if(Array.isArray(d[k]))d[k].forEach(x=>{if(!x.desc)x.desc=SPELL_SUMMARY[x.name]||""})});
  if(typeof d.conc!=="string")d.conc="";
  const out=Object.assign(base,d);
  out.skills=Object.assign(JSON.parse(JSON.stringify(DEFAULT.skills)),d.skills||{});
  out.abil=Object.assign(JSON.parse(JSON.stringify(DEFAULT.abil)),d.abil||{});
  out.look=Object.assign({},DEFAULT.look,d.look||{});out.coins=Object.assign({},DEFAULT.coins,d.coins||{});
  return out}
